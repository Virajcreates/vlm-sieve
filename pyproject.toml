[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlm-sieve"
version = "0.1.0"
description = "Event-driven video frame gatekeeper, active ROI cropper, and temporal storyboard packer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "vlm-sieve contributors" }
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "pydantic>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/Virajcreates/vlm-sieve"
Repository = "https://github.com/Virajcreates/vlm-sieve"
Issues = "https://github.com/Virajcreates/vlm-sieve/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
vlmsieve = "vlmsieve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlmsieve"]
