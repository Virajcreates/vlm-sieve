[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "vlm-sieve"
version = "0.2.1"
description = "Local-first, zero-GPU spatial-temporal video gatekeeper & storyboard packer that cuts Vision-Language Model (VLM) token costs by 65-85%."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Viraj D Naik" }
]
keywords = [
    "vlm-sieve",
    "vlmsieve",
    "vlm",
    "vision-language-models",
    "video-processing",
    "frame-sampling",
    "roi-cropping",
    "video-understanding",
    "token-optimization",
    "gemini",
    "gpt-4o",
    "computer-vision",
    "opencv",
    "storyboard",
    "multimodal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
audio = [
    "imageio-ffmpeg>=0.4.9",
]
dev = [
    "pytest>=7.4.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Virajcreates/vlm-sieve"
Repository = "https://github.com/Virajcreates/vlm-sieve"
Documentation = "https://github.com/Virajcreates/vlm-sieve#readme"
Issues = "https://github.com/Virajcreates/vlm-sieve/issues"
PyPI = "https://pypi.org/project/vlm-sieve/"

[project.scripts]
vlmsieve = "vlmsieve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlmsieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
